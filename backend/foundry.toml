[profile.default] 
src = "src"                                     # src contrats 
out = "out"                                     # Dossier de compilation
libs = ["lib"]                                  # Dependencies      
solc = "0.8.20"

# Tests
test = "test"
cache_path = "cache_forge"

# Optimizations 
optimizer = true
optimizer_runs = 200

# Fork Base mainnet Configuration 
fork_url = "https://base-mainnet.infura.io/v3/${INFURA_API_KEY}"
fork_block_number = 0

# Gas reports
gas_reports = ["*"]
verbosity = 2

# Environment variables
fs_permissions = [{ access = "read", path = ".env" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
base = "https://base-mainnet.infura.io/v3/${INFURA_API_KEY}"
base_public = "https://mainnet.base.org"

# Profile pour tests sans fork (plus rapide pour dev)
[profile.local]
fork_url = ""