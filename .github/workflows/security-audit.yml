name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  slither-audit:
    name: Slither Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.19.2
        uses: actions/setup-node@v1
        with:
          node-version: 20.19.2

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: 'backend/node_modules'
          key: node_modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither Analysis
        working-directory: backend
        run: |
          slither contracts/ChainLend.sol --solc-remaps "@openzeppelin/contracts=node_modules/@openzeppelin/contracts" \
          --filter-paths "node_modules" \
          --exclude-informational \
          --exclude-low
        continue-on-error: true

      - name: Run Slither Full Report
        working-directory: backend
        run: slither contracts/ChainLend.sol --solc-remaps "@openzeppelin/contracts=node_modules/@openzeppelin/contracts" --filter-paths "node_modules" || true >> $GITHUB_STEP_SUMMARY
         